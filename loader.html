<!-- Paste into Webflow → Site settings → Custom code → Footer code.
     Replace REPO (2×) and the @X.Y.Z version. -->
<script>
  (function () {
    var PROD = "https://cdn.jsdelivr.net/gh/brandvm/REPO@X.Y.Z/dist/index.js";
    var STAGING = "https://brandvm.github.io/REPO/index.js";
    var DEV = "http://localhost:3000/index.js";
    var staging = /\.webflow\.io$/.test(location.hostname);
    var flag = false;
    try {
      flag = staging && localStorage.getItem("bv-dev") === "1";
    } catch (e) {}
    function load(src, fallback) {
      var s = document.createElement("script");
      s.src = src;
      if (fallback) s.onerror = fallback;
      document.head.appendChild(s);
    }
    var fresh = STAGING + "?v=" + Date.now();
    if (flag)
      load(DEV, function () {
        load(fresh);
      });
    else if (staging)
      load(fresh, function () {
        load(PROD);
      });
    else load(PROD);
  })();
</script>
