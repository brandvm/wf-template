<!-- ============================================================
Custom-code loading — three pieces, pasted into three different places
in Webflow (piece 2 is two Embeds, 2a and 2b). Replace ORG and REPO (all occurrences, pieces 1 and 2). The release
version lives in ONE place: RELEASE in piece 1.

  prod        = pinned jsDelivr tag (immutable)
  webflow.io  = latest pushed staging bundle (JS + CSS)

There is no local mode: a page never loads code from this machine. To
see a change on staging, git push and reload (~1 min).

Everything that is not below lives in src/ and ships through the
bundle. Resist adding site logic to any of these three snippets —
they are bootstrap only, and they are the one part of the system
that is not versioned, reviewable, or rollback-able. A push never
updates them: any change here must be re-pasted into Webflow and
published.

------------------------------------------------------------
1) Head code — Site settings → Custom code → Head code.

   Only things that must exist before the bundle does: the shared
   config (window.WFC), meta tags the browser reads at parse time,
   connection warming, and the pre-paint scroll lock.

   RELEASE is null until the first tag exists. While it is null, a
   page served from a custom domain uses the STAGING bundle and logs a
   console error — so attaching a domain before the first release
   shows the site instead of 404ing every asset. Set RELEASE to the
   tag before launch; staging must never be what production runs on.

   Site custom code is ignored by the Designer canvas, which is what
   we want here — no scroll lock, no preloader while designing.
------------------------------------------------------------ -->
<meta name="theme-color" content="#000000" />

<script>
  (function () {
    var RELEASE = null; // the release tag, e.g. "1.0.0" — the only version string
    var OWNER = "ORG"; // the GitHub org or user that owns this repo
    var SITE = "REPO"; // this repo's name
    var STAG = "https://" + OWNER + ".github.io/" + SITE + "/";
    // *.canvas.webflow.com is the Designer's custom-code preview: it runs
    // the staging bundle like webflow.io.
    var staging = /\.webflow\.io$|\.canvas\.webflow\.com$/.test(location.hostname);
    var prod = RELEASE
      ? "https://cdn.jsdelivr.net/gh/" + OWNER + "/" + SITE + "@" + RELEASE + "/dist/"
      : STAG;
    if (!staging && !RELEASE)
      console.error("[wfc] RELEASE is not set in head code; serving the staging bundle. Tag a release and set RELEASE before launch.");
    // Warm the connection to wherever the bundle comes from (GitHub Pages
    // on staging, jsDelivr with a RELEASE). A fixed
    // jsDelivr preconnect went unused on staging and before the first
    // release. Two links on purpose: the stylesheet and its font fetches
    // are CORS-different and open separate connections.
    var origin = new URL(staging ? STAG : prod).origin;
    [false, true].forEach(function (cors) {
      var warm = document.createElement("link");
      warm.rel = "preconnect";
      warm.href = origin;
      if (cors) warm.crossOrigin = "";
      document.head.appendChild(warm);
    });
    // The canvas Embed (2a) must link the staging stylesheet, for the
    // Designer. On a release domain, write the pinned sheet into <head>
    // instead: a parser-inserted head stylesheet holds first paint in every
    // browser, so the page never paints at the wrong scale (§01). Then
    // re-point 2a at the same file as the parser inserts it (one request;
    // the observer runs before 2b), so GitHub Pages never holds the page and
    // 2b's swap is a no-op. If the observer misses, 2b swaps as before.
    // document.write is deliberate (Lighthouse flags it): only a
    // parser-inserted sheet holds first paint, and it writes a stylesheet,
    // never a script, so Chrome's document.write intervention doesn't apply.
    // If the release sheet fails (jsDelivr down or blocked), 2a goes back to
    // its staging sheet so the page stays styled, as it did before 0.8.0.
    var releaseCSSFailed;
    if (!staging && RELEASE) {
      var want = prod + "styles.css";
      var embed, embedHref, failed = false;
      releaseCSSFailed = function () {
        failed = true;
        if (embed && embed.href === want) embed.href = embedHref;
      };
      document.write('<link rel="stylesheet" href="' + want + '" onerror="WFC.releaseCSSFailed()">');
      if (window.MutationObserver) {
        var watch = new MutationObserver(function () {
          var link = document.getElementById("wfc-css");
          if (!link) return;
          watch.disconnect();
          embed = link;
          embedHref = link.href;
          if (!failed && link.href !== want) link.href = want;
        });
        watch.observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener("DOMContentLoaded", function () { watch.disconnect(); });
      }
    }
    // Shared config — the Embed, the footer loader and the bundle read this.
    window.WFC = {
      staging: staging, stag: STAG,
      release: RELEASE, prod: prod, releaseCSSFailed: releaseCSSFailed,
    };

    // Paired with the html.is-loading rules in src/styles.css. The bundle
    // removes this when it boots; the timeout is the safety net so a 404
    // on the bundle never leaves a permanently scroll-locked page. A plain
    // timeout, not one started on `load` — a slow image would otherwise
    // keep the page locked far past 3 s.
    var root = document.documentElement;
    root.classList.add("is-loading");
    setTimeout(function () { root.classList.remove("is-loading"); }, 3000);
  })();
</script>

<!-- ============================================================
2) CSS — TWO HTML Embed elements ON THE CANVAS, inside the component
   that sits on every page (G | Components; see the skill's
   conventions.md §1), 2a first and 2b directly after it.
   NOT Site settings → Head code.

     2a  the <link> only
     2b  the <script> only

   Why two: the Designer canvas skips an Embed that contains a <script>
   entirely, so a <link> in the same Embed never renders there and the
   canvas shows no repo CSS. Order matters: 2b finds the link by id, so
   it must come after 2a, with nothing that paints in between.

   Why an Embed and not head code: the Designer canvas ignores site
   custom code and never runs scripts, but it DOES render an Embed's
   markup — so a real <link> tag is the only way to see our CSS while
   designing. An icon font belongs here for the same reason: in head
   code the canvas would show blank boxes where every icon should be.

   The canvas shows the STAGING stylesheet: push, wait ~1 min, reload
   the Designer tab. On a release domain the head code (piece 1) writes
   the pinned sheet into <head> and points this link at it before it
   loads, so production never waits for the staging sheet (2b's swap is
   then a fallback); on webflow.io 2b keeps the
   sheet the parser already fetched and swaps in a cache-busted copy only
   after `load`.

   Never add a localhost <link> here, not even for a moment: every
   public visitor's browser would request this machine, which can block
   rendering and triggers Chrome's local-network-access prompt.

   GitHub Pages caches ~10 min; bump ?v=1 below to pull fresh staging
   CSS into the canvas.

   Placement: an Embed in the body loads after Webflow's own
   stylesheet, so our rules win ties on specificity. That is exactly
   why repo CSS must not restyle anything the Designer can — see the
   CSS policy in AGENTS.md.
------------------------------------------------------------ -->
<link
  id="wfc-css"
  rel="stylesheet"
  href="https://ORG.github.io/REPO/styles.css?v=1"
/>

<!-- ============================================================
2b) Second HTML Embed, directly after 2a in the same component: this
    script only. The canvas never runs it (2a still shows the staging
    CSS there); on published pages it swaps in the right stylesheet and
    defines WFC.setCSS, which piece 3 uses for its fallbacks.
------------------------------------------------------------ -->
<script>
  (function () {
    var C = window.WFC;
    var base = document.getElementById("wfc-css");
    if (!C) return console.error("[wfc] Head code config missing; the stylesheet stays on staging.");
    if (!base) return;
    // Swap stylesheets without an unstyled gap. The staging sheet from 2a
    // is already loading (or applied) when this runs, so the swap is NOT
    // settled before first paint. Assigning a new href to a <link> drops
    // its rules until the new file arrives; this sheet scales the type
    // (§01), so pages re-rendered at the wrong scale and jumped — a
    // full-page layout shift, measured at CLS 0.2–0.5 on desktop. Instead
    // the target loads next to the current sheet; the old one goes only
    // once the new one has loaded, and stays if the new one fails. The id
    // moves at once, so later lookups (piece 3) find the target. Same
    // URL = no-op.
    C.setCSS = function (href) {
      var cur = document.getElementById("wfc-css");
      if (!cur) return;
      var url = new URL(href, location.href).href;
      if (cur.href === url) return;
      var next = document.createElement("link");
      next.rel = "stylesheet";
      next.href = url;
      cur.removeAttribute("id");
      next.id = "wfc-css";
      next.onload = function () { if (cur.parentNode) cur.parentNode.removeChild(cur); };
      // On error, give the id back only if no newer swap has taken it
      // (a second setCSS call while this one was still loading).
      next.onerror = function () {
        if (next.parentNode) next.parentNode.removeChild(next);
        if (!document.getElementById("wfc-css")) cur.id = "wfc-css";
      };
      cur.parentNode.insertBefore(next, cur.nextSibling);
    };
    if (!C.staging && C.prod !== C.stag) C.setCSS(C.prod + "styles.css");
    else
      // Staging (webflow.io, or a domain before the first release): keep the
      // sheet from 2a. Swapping before first paint fetched it a second time,
      // render-blocking, and shifted the layout when it arrived. GitHub
      // Pages caches ~10 min, so a cache-busted copy follows after `load`,
      // unless a fallback has taken the bundle elsewhere.
      window.addEventListener("load", function () {
        if (C.source === C.stag) C.setCSS(C.stag + "styles.css?v=" + Date.now());
      });
  })();
</script>

<!-- ============================================================
3) JS loader — Site settings → Custom code → Footer code.

Nothing else belongs in the footer. Third-party libraries go through
`pnpm add` and get bundled: the loader appends its script tag
dynamically, which makes it async, so a sibling <script defer> in the
footer is no longer guaranteed to execute first and the bundle can
find its global undefined.

Rollback = set RELEASE in piece 1 back to the previous tag and publish.
============================================================ -->
<script>
  (function () {
    var C = window.WFC;
    if (!C) return console.error("[wfc] Head code config missing; custom code not loaded.");
    if (!document.getElementById("wfc-css"))
      console.warn("[wfc] CSS embed not found on this page; styles are missing.");
    function js(src, fallback) {
      // Set before execution: the base the bundle actually loads from,
      // including the staging -> pinned release fallback.
      C.source = new URL(".", src).href;
      var baseCSS = document.getElementById("wfc-css");
      var cssURL = C.source + "styles.css" + new URL(src).search;
      // Re-point the sheet only when it comes from somewhere else (a
      // fallback), so CSS and JS match: staging keeps the sheet 2b left.
      // setCSS (piece 2b) swaps without an unstyled gap; fall back to a
      // plain href if 2b is an older copy.
      if (baseCSS && baseCSS.href.indexOf(C.source) === 0) { /* already there */ }
      else if (C.setCSS) C.setCSS(cssURL);
      else if (baseCSS) baseCSS.href = cssURL;
      var s = document.createElement("script");
      s.src = src;
      if (fallback) s.onerror = fallback;
      document.head.appendChild(s);
    }
    var v = "?v=" + Date.now();
    if (C.staging)
      js(C.stag + "index.js" + v, C.release ? function () {
        js(C.prod + "index.js");
      } : null);
    else js(C.prod + "index.js" + (C.release ? "" : v));
  })();
</script>
