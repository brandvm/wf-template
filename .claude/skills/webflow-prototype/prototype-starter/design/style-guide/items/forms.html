<!-- Specimens for the style guide's "Forms" section. In Webflow this is a
     Form Block: Form on the form, a Form Field holding the Label and a Form
     Input, and a real <button type="submit"> holding a Button Color
     instance (a native submit input can't hold the icon and label). It
     also keeps the reserved classes Form and Label in use. -->

<!-- sg: section=forms | name=Form | class=.form · .form-field · .label · .form-input | note=Form Block with one field and a submit button. Form Input has its own focus states: border on focus, ring on keyboard focus. -->
<form class="form"><div class="form-field"><label class="label">Name<input class="form-input" type="text" name="Name"></label></div><button class="button" type="submit"><div class="button-color"><div class="button-size"><div class="button-content"><div>Submit</div><div class="button-icon"><div class="icon"><i class="icon-glyph ph ph-arrow-right" aria-hidden="true"> </i></div></div></div></div></div></button></form>
