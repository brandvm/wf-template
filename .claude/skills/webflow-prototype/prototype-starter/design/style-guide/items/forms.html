<!-- Specimens for the style guide's "Forms" section. In Webflow this is a
     Form Block: Form on the form, Label on the label, an input, and the
     submit button with Button. It also keeps the reserved classes Form and
     Label in use. -->

<!-- sg: section=forms | name=Form | class=.form · .label | note=Form Block with a Label, a text input and a submit Button -->
<form class="form"><label class="label">Label<input type="text" name="example" placeholder="Text input"></label><button class="button" type="submit">Submit</button></form>
