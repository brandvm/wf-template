<!-- Specimens for the style guide's "Components" section: the components

     project adds its own with sg:start blocks on the page that uses them. -->

<!-- sg: section=components | name=Icon | class=.icon-color › .icon › .icon-glyph | note=Phosphor icon. Prop Icon: ph ph-name, from phosphoricons.com. Sizes are named by their size at 16px text (12px to 64px) and set in em, so an icon scales with the font size around it. Icon Color wraps it for a colour of its own: Inherit, Primary, Secondary, Accent. -->
<div class="icon w-variant-d345939b-019f-e2df-81ad-4ea069bff178"><i class="icon-glyph ph ph-plus" aria-hidden="true">&nbsp;</i></div><div class="icon"><i class="icon-glyph ph ph-arrow-right" aria-hidden="true">&nbsp;</i></div><div class="icon w-variant-d9b45e0b-d9ad-95e4-d5c6-8074032e905f"><i class="icon-glyph ph ph-magnifying-glass" aria-hidden="true">&nbsp;</i></div><div class="icon w-variant-7bce87e3-ab9e-6f63-a957-78d54b4abbad"><i class="icon-glyph ph ph-envelope-simple" aria-hidden="true">&nbsp;</i></div><div class="icon w-variant-5d98fcb5-a6a5-151f-a201-b059ea992cef"><i class="icon-glyph ph ph-cube" aria-hidden="true">&nbsp;</i></div><div class="icon w-variant-e4d16f47-99b8-e0f3-e283-4d6f504865bc"><i class="icon-glyph ph ph-house" aria-hidden="true">&nbsp;</i></div><div class="icon w-variant-9d41bcf1-4466-cbd4-2654-9c4b1423e643"><i class="icon-glyph ph ph-star" aria-hidden="true">&nbsp;</i></div><div class="icon-color"><div class="icon"><i class="icon-glyph ph ph-check-circle" aria-hidden="true">&nbsp;</i></div></div><div class="icon-color w-variant-62928812-eb99-4c09-9f13-32d22d00b3e4"><div class="icon"><i class="icon-glyph ph ph-check-circle" aria-hidden="true">&nbsp;</i></div></div><div class="icon-color w-variant-3cf75344-2f7a-18f9-d091-f365874dc11f"><div class="icon"><i class="icon-glyph ph ph-check-circle" aria-hidden="true">&nbsp;</i></div></div><div class="icon-color w-variant-95ba9505-d3f3-fbe1-ca24-0e30820d1b57"><div class="icon"><i class="icon-glyph ph ph-check-circle" aria-hidden="true">&nbsp;</i></div></div>

<!-- sg: section=components | name=C | Button | class=.button › .button-color › .button-size › .button-content | note=The link button. Props: Label, Link, Icon, Icon Before, Icon After. Color: Primary, Secondary. Size: Default, Small. -->
<a class="button" href="#components"><div class="button-color"><div class="button-size"><div class="button-content"><div>Button</div><div class="button-icon"><div class="icon"><i class="icon-glyph ph ph-arrow-right" aria-hidden="true">&nbsp;</i></div></div></div></div></div></a><a class="button" href="#components"><div class="button-color"><div class="button-size"><div class="button-content"><div class="button-icon"><div class="icon"><i class="icon-glyph ph ph-arrow-left" aria-hidden="true">&nbsp;</i></div></div><div>Back</div></div></div></div></a>

<!-- sg: section=components | name=C | Icon Button | class=.button › .icon-button-box | note=Icon-only button element. Props: Icon, Accessible Name (required: what the button does), Hook (the data attribute a script listens for). Variants: Primary, Secondary. -->
<button class="button" type="button" aria-label="Next"><div class="icon-button-box"><div class="icon w-variant-7bce87e3-ab9e-6f63-a957-78d54b4abbad"><i class="icon-glyph ph ph-arrow-right" aria-hidden="true">&nbsp;</i></div></div></button><button class="button" type="button" aria-label="Close"><div class="icon-button-box w-variant-dfb6235f-76ea-8fb6-7df7-17486e2c7d7c"><div class="icon w-variant-7bce87e3-ab9e-6f63-a957-78d54b4abbad"><i class="icon-glyph ph ph-x" aria-hidden="true">&nbsp;</i></div></div></button>

<!-- sg: section=components | name=C | Video | class=.video | note=Plays a file hosted through the media page. Props: MP4, Poster, and one text prop per attribute (autoplay, muted, loop, playsinline): clear a prop to remove the attribute. -->
<video class="video" muted="true" loop="true" playsinline="true" preload="metadata"></video>

<!-- sg: section=components | name=Section Head | class=.section-head | note=Chip, heading and text at the top of a section. Props: Chip, Show Chip, Heading, Text. -->
<div class="section-head"><div class="chip">Chip</div><h2 class="d2">Section heading</h2><p class="body-l">One or two lines that say what this section is about.</p></div>
